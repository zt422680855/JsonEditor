plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.2.1'
}

group = 'com.zt'
version = '2.9.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation 'com.alibaba:fastjson:1.2.58'
    intellijPlatform {
        intellijIdeaCommunity('2024.3')
        bundledPlugins('com.intellij.java')
    }
}

intellijPlatform {
    instrumentCode = false

    publishing {
        token = providers.environmentVariable('PUBLISH_TOKEN')
                .orElse(providers.gradleProperty('publishToken'))
                .getOrElse('')
        channels = ['default']
    }

    pluginConfiguration {
        id = 'com.zt.json-editor'
        name = 'JSON Editor'
        version = project.version
        description = '''Fix compatibility issues with IDEA 2023.x-2026.x and supports multiple editors.'''
        changeNotes = provider {
            """
            <h3>2.9.5</h3>
            <ul>
                <li>Fix compatibility issues with IDEA 2023.x-2026.x</li>
                <li>Optimize JSON language registration</li>
            </ul>
            """
        }
        ideaVersion {
            sinceBuild = '231.8109.175'
            untilBuild = '253.*'
        }
    }

    pluginVerification {
        ides {
            ide("IC", "2024.3")
            ide("IC", "2025.1")
            ide("IC", "2025.2")
        }
    }

}

patchPluginXml {
//    sinceBuild = '202.8194.7'
//    untilBuild = '231.*'
    sinceBuild = '231.8109.175'
    untilBuild = '261.22158.277'

}

tasks.named('buildSearchableOptions') {
    enabled = false
}

tasks.register('validatePluginConfiguration') {
    doLast {
        println "Plugin ID: ${intellijPlatform.pluginConfiguration.id.get()}"
        println "Plugin Name: ${intellijPlatform.pluginConfiguration.name.get()}"
        println "Version: ${project.version}"
        println "Since Build: ${intellijPlatform.pluginConfiguration.ideaVersion.sinceBuild.get()}"
        println "Until Build: ${intellijPlatform.pluginConfiguration.ideaVersion.untilBuild.get()}"
    }
}
